<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7B4DFF">
<title>Кот-пилот: полёт над Россией</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs><linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FDFF"/><stop offset="0.3" stop-color="#8EF1FF"/><stop offset="0.55" stop-color="#FFB3EC"/><stop offset="0.8" stop-color="#B9A2FF"/><stop offset="1" stop-color="#F3EEFF"/></linearGradient></defs></svg>

  <canvas id="game" aria-label="Игровое поле: нажимай, чтобы самолётик поднимался"></canvas>

  <div id="hud" class="hud" hidden>
    <canvas id="score-canvas" class="score" role="img" aria-label="Очки: 0"></canvas>
  </div>

  <div id="corner" class="corner" hidden>
    <button id="btn-close" class="icon-btn" type="button" aria-label="Закрыть игру">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-sound" class="icon-btn" type="button" aria-label="Выключить звук">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3.5L12 5.2v13.6L7.5 15H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3.5L12 5.2v13.6L7.5 15H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="hint" class="hint" hidden></div>
  <div id="banner" class="banner" hidden>
    <div id="banner-name" class="banner-name"></div>
  </div>

  <section id="screen-menu" class="screen-menu" hidden>
    <div class="menu-start">
      <div class="start-wrap">
        <button id="btn-start" class="btn btn-primary btn-start" type="button">Полетели!</button>
        <svg class="doodle doodle-swoosh" viewBox="0 0 56 40" aria-hidden="true"><g fill="none" stroke-linecap="round"><g stroke="url(#holo)" stroke-width="3.5"><path d="M52 7C38 5 22 7 6 13"/><path d="M52 20C40 20 28 22 15 26"/><path d="M52 33C44 33 35 34 26 36"/></g></g></svg>
        <svg class="doodle doodle-spark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1.6 9.6 6.4 14.4 18 18-11.6 3.6-16.4 8.4-18 18-1.6-9.6-6.4-14.4-18-18 11.6-3.6 16.4-8.4 18-18z" fill="url(#holo)"/></svg>
        <svg class="doodle doodle-drops" viewBox="0 0 40 40" aria-hidden="true"><g fill="#2A1470"><path d="M13 3c7 9 9 17 4 21s-12-1-10-9z"/><path d="M31 9c5 7 6 13 2 16s-9-1-8-7z"/></g></svg>
      </div>
    </div>
  </section>

  <section id="screen-card" class="screen" hidden>
    <div class="panel card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <div id="card-media" class="card-media"><img id="card-image" alt=""></div>
      <svg class="doodle doodle-spark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1.6 9.6 6.4 14.4 18 18-11.6 3.6-16.4 8.4-18 18-1.6-9.6-6.4-14.4-18-18 11.6-3.6 16.4-8.4 18-18z" fill="url(#holo)"/></svg>
      <div class="card-body">
        <h2 id="card-title"></h2>
        <div id="card-text" class="card-text"></div>
        <button id="btn-card" class="btn btn-primary" type="button">Летим дальше!</button>
      </div>
    </div>
  </section>

  <section id="screen-pause" class="screen" hidden>
    <div class="panel">
      <svg class="doodle doodle-spark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1.6 9.6 6.4 14.4 18 18-11.6 3.6-16.4 8.4-18 18-1.6-9.6-6.4-14.4-18-18 11.6-3.6 16.4-8.4 18-18z" fill="url(#holo)"/></svg>
      <h2>Пауза</h2>
      <p>Самолётик ждёт, пока ты вернёшься.</p>
      <button class="btn btn-primary" type="button" data-action="resume">Продолжить полёт</button>
      <button class="btn btn-secondary" type="button" data-action="restart">Начать сначала</button>
      <button class="btn btn-secondary" type="button" data-action="exit">Выйти</button>
    </div>
  </section>

  <section id="screen-crash" class="screen" hidden>
    <div class="panel">
      <svg class="doodle doodle-drops" viewBox="0 0 40 40" aria-hidden="true"><g fill="#7A2A00"><path d="M13 3c7 9 9 17 4 21s-12-1-10-9z"/><path d="M31 9c5 7 6 13 2 16s-9-1-8-7z"/></g></svg>
      <svg class="doodle doodle-spark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1.6 9.6 6.4 14.4 18 18-11.6 3.6-16.4 8.4-18 18-1.6-9.6-6.4-14.4-18-18 11.6-3.6 16.4-8.4 18-18z" fill="url(#holo)"/></svg>
      <h2>В следующий раз будет лучше!</h2>
      <div class="result-row">
        <div><b id="crash-score">0</b><span id="crash-score-label">очков</span></div>
        <div><b id="crash-best">0</b><span>рекорд</span></div>
      </div>
      <button id="btn-continue" class="btn btn-primary" type="button">Попробовать ещё раз</button>
    </div>
  </section>

  <section id="screen-win" class="screen" hidden>
    <div class="panel">
      <svg class="doodle doodle-trophy" viewBox="0 0 64 72" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="url(#holo)" stroke-width="3.5"><path d="M18 8h28v14c0 10-6 17-14 17s-14-7-14-17z"/><path d="M18 13H8c0 9 5 14 12 14M46 13h10c0 9-5 14-12 14"/><path d="M32 39v10M22 62h20l-3-13H25z"/><path d="M32 14l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></g></g></svg>
      <svg class="doodle doodle-spark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2c1.6 9.6 6.4 14.4 18 18-11.6 3.6-16.4 8.4-18 18-1.6-9.6-6.4-14.4-18-18 11.6-3.6 16.4-8.4 18-18z" fill="url(#holo)"/></svg>
      <p class="eyebrow">Маршрут пройден!</p>
      <h2>Ты долетел до финиша!</h2>
      <p id="win-text"></p>
      <div id="win-collection" class="collection"></div>
      <button class="btn btn-primary" type="button" data-action="restart">Сыграть ещё</button>
    </div>
  </section>

  <div id="loading" class="loading">Загружаем…</div>
</div>

<script src="js/bridge.js"></script>
<script src="js/sound.js"></script>
<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
