<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обложка «Кот-пилот»</title>
<style>
  html, body { margin: 0; background: #F2F5F7; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- Генератор обложки для карточки игры в «Контенте»: cover.html?w=360&h=320&dpr=3
     Рисует графикой самой игры: три региона диагональными панелями и самолётик с котом. -->
<canvas id="cover"></canvas>
<script src="../game/js/art.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var w = Number(params.get('w')) || 360;
  var h = Number(params.get('h')) || 320;
  var dpr = Number(params.get('dpr')) || 3;
  var canvas = document.getElementById('cover');
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  var ctx = canvas.getContext('2d');

  var H = Art.H;
  var s = canvas.height / H;
  var W = canvas.width / s;
  Art.setup(s, W);
  ctx.setTransform(s, 0, 0, s, 0, 0);

  var scenes = ['volga', 'ural', 'baikal'];
  var cuts = [W * 0.35, W * 0.67];
  var slant = H * 0.22;

  scenes.forEach(function (name, i) {
    var left = i === 0 ? null : cuts[i - 1];
    var right = i === scenes.length - 1 ? null : cuts[i];
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(left === null ? -10 : left + slant / 2, 0);
    ctx.lineTo(right === null ? W + 10 : right + slant / 2, 0);
    ctx.lineTo(right === null ? W + 10 : right - slant / 2, H);
    ctx.lineTo(left === null ? -10 : left - slant / 2, H);
    ctx.closePath();
    ctx.clip();
    Art.drawBack(ctx, name, i * 210 + 60, 1);
    Art.drawGround(ctx, name, i * 210 + 60, 1);
    ctx.restore();
  });

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 10;
  cuts.forEach(function (x) {
    ctx.beginPath();
    ctx.moveTo(x + slant / 2, -5);
    ctx.lineTo(x - slant / 2, H + 5);
    ctx.stroke();
  });

  var k = Math.min(W * 0.4 / 66, H * 0.4 / 56);
  var px = W * 0.5;
  var py = H * 0.47;

  // след за самолётиком и монетки на пути
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineCap = 'round';
  [[-0.9, -8, 0.7], [-1.0, 6, 0.9], [-0.85, 18, 0.6]].forEach(function (line) {
    ctx.lineWidth = 4 * k * 0.5;
    ctx.beginPath();
    ctx.moveTo(px - 36 * k, py + line[1] * k * 0.5);
    ctx.lineTo(px - 36 * k - W * 0.18 * line[2], py + line[1] * k * 0.5 + 20);
    ctx.stroke();
  });
  [[0.16, 0.33, 1.6], [0.84, 0.3, 1.8], [0.76, 0.66, 1.4]].forEach(function (coin, i) {
    ctx.save();
    ctx.translate(W * coin[0], H * coin[1]);
    ctx.scale(coin[2], coin[2]);
    Art.drawCoin(ctx, 0, 0, 0.2 + i * 0.6);
    ctx.restore();
  });

  ctx.save();
  ctx.translate(px, py);
  ctx.scale(k, k);
  Art.drawPlane(ctx, 0, 0, -0.16, 0.37);
  ctx.restore();

  window.coverReady = true;
})();
</script>
</body>
</html>
